<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="gift-scene" id="gift-scene">
    <p class="eyebrow">Happy birthday</p>
    <h1>Dad</h1>

    <div class="stage" id="stage">
      <button class="gift gift--outer" id="gift-1" type="button" aria-label="Open your present">
        <span class="box">
          <span class="cavity" aria-hidden="true">
            <span class="inner-rise">
              <span class="mini-gift">
                <span class="mini-lid"></span>
                <span class="mini-body"></span>
                <span class="mini-bow"></span>
              </span>
            </span>
          </span>
          <span class="box-body">
            <span class="ribbon-v"></span>
            <span class="band band-left"></span>
            <span class="band band-right"></span>
          </span>
          <span class="lid">
            <span class="lid-face"></span>
            <span class="ribbon-v ribbon-lid"></span>
            <span class="bow" aria-hidden="true">
              <span class="loop loop-left"></span>
              <span class="loop loop-right"></span>
              <span class="knot"></span>
              <span class="tail tail-left"></span>
              <span class="tail tail-right"></span>
            </span>
          </span>
        </span>
      </button>

      <button class="gift gift--inner" id="gift-2" type="button" aria-label="Open this one too" hidden>
        <span class="box">
          <span class="cavity" aria-hidden="true">
            <span class="photo-crop">
              <img class="gift-photo" src="images/cover-outside.jpg" alt="">
            </span>
          </span>
          <span class="box-body">
            <span class="ribbon-v"></span>
            <span class="band band-left"></span>
            <span class="band band-right"></span>
          </span>
          <span class="lid">
            <span class="lid-face"></span>
            <span class="ribbon-v ribbon-lid"></span>
            <span class="bow" aria-hidden="true">
              <span class="loop loop-left"></span>
              <span class="loop loop-right"></span>
              <span class="knot"></span>
              <span class="tail tail-left"></span>
              <span class="tail tail-right"></span>
            </span>
          </span>
        </span>
      </button>
    </div>

    <p class="hint" id="hint">Tap to open</p>
  </section>

  <section class="present" id="present" hidden>
    <div class="present-inner">
      <h2 tabindex="-1">It won’t be here today.</h2>
      <p class="lead">But this is what I got you.</p>

      <figure class="hero">
        <img id="hero-img" src="images/cover-outside.jpg" alt="Pilot logbook cover">
      </figure>

      <div class="thumbs" role="list">
        <button class="thumb is-selected" type="button" aria-label="Photo 1" data-src="images/cover-outside.jpg" data-alt="Pilot logbook cover">
          <img src="images/cover-outside.jpg" alt="">
        </button>
        <button class="thumb" type="button" aria-label="Photo 2" data-src="images/covers-group.jpg" data-alt="Pilot logbook cover">
          <img src="images/covers-group.jpg" alt="">
        </button>
        <button class="thumb" type="button" aria-label="Photo 3" data-src="images/cover-detail.jpg" data-alt="Pilot logbook cover">
          <img src="images/cover-detail.jpg" alt="">
        </button>
        <button class="thumb" type="button" aria-label="Photo 4" data-src="images/cover-inside.jpg" data-alt="Pilot logbook cover">
          <img src="images/cover-inside.jpg" alt="">
        </button>
        <button class="thumb" type="button" aria-label="Photo 5" data-src="images/cover-engraving.jpg" data-alt="Pilot logbook">
          <img src="images/cover-engraving.jpg" alt="">
        </button>
      </div>

      <div class="copy">
        <h3>Pilot logbook cover</h3>
        <p>
          <a href="https://www.sparrowhawkleather.co.nz/collections/logbook-covers/products/nzcaa-pilot-logbook-cover-book-closure-black-aniline-laser-engraved-wings-name-patch">Sparrowhawk Leather</a>
        </p>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
